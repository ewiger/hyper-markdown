[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The folder is `tools/hmd`; the distribution is `hypermarkdown`, renamed from
# `hyper-markdown` on 2026-08-10 along with the project's domain, repository,
# and galleries (HMD-0005).
#
# PyPI has no rename, so this is a new project rather than a move: `0.1.1` stays
# installable as `hyper-markdown` forever, receives no further release, and is
# pruned deliberately later. Do NOT delete that project while its install line
# is still reachable from any published page — a freed name can be registered by
# anyone and served to a stale pin.
#
# The new project needs its own trusted publisher, since a publisher is pinned
# to an owner, a repository name, a workflow file, and an environment, and none
# of those follows a rename. Configured as `ewiger` / `hypermarkdown` /
# `release.yml` / `pypi`, with the TestPyPI twin on `testpypi`.
name = "hypermarkdown"
# One source of truth: `src/hypermarkdown/__init__.py`. A version in two files
# is a version that disagrees with itself on release day, and `hmd --version`
# reads the module rather than the installed metadata so it is honest when run
# from a checkout.
dynamic = ["version"]
description = "A strict, machine-checkable markdown dialect for project knowledge bases."
# `readme`, `license-files`, and the changelog in `MANIFEST.in` are this tool's
# own files, checked in beside this one. They were symlinks into the repository
# root until 2026-08-08, which made the PyPI long description the monorepo's
# front page — a page that opened by explaining the format and closed by naming
# three tools, two of which cannot be `pip install`ed. Every tool under `tools/`
# now carries its own set, and this README is about the `hmd` command.
#
# Two rules that follow from a README being read on PyPI rather than on GitHub.
# Its links MUST be absolute: a relative link in a long description resolves
# against `pypi.org`, so the old symlinked README's links were dead on the page
# most users see first. And it MUST NOT be re-pointed at the root by any means,
# including a symlink — setuptools refuses to read outside the project directory
# anyway (`readme = "../../README.md"` fails the build outright), so the only
# other spelling was the one just removed.
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Yakimovich" }]
keywords = [
    "markdown",
    "wiki",
    "knowledge-base",
    "wikilinks",
    "linter",
    "mkdocs",
    "documentation",
]
# No `License ::` classifier — with the SPDX `license` field above, setuptools
# rejects carrying both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # Every range is capped at the next major. A major bump is where a
    # dependency is allowed to break its own contract, and this project has
    # twice been handed one it did not ask for; `uv.lock` pins what is actually
    # built and tested, and these bounds are what a consumer's resolver is held
    # to when it does not use that lock.
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "markdown>=3.6,<4",
    # The floor is 10.21.2 because that release is what makes `superfences`
    # survive Pygments 2.20: under 10.21 and earlier the preprocessor stops
    # matching fences entirely and every code block degrades to running text,
    # with nothing raised. Bisected 10.20.1 and 10.21 broken, 10.21.2 and
    # 10.21.3 correct, all against pygments 2.20.0.
    #
    # This constraint belongs here rather than in the `mkdocs` extra, which is
    # where 0.1.0 wrongly put its half of it. `pymdownx.superfences` is loaded
    # by `render/flat.py` for `hmd render --to html`, so the base install needs
    # the guarantee whether or not a site is ever built.
    "pymdown-extensions>=10.21.2,<12",
]

[project.optional-dependencies]
mkdocs = [
    # Held at 1.x on purpose. "MkDocs 2.0" is a ground-up rewrite published
    # under the same name on PyPI, and it removes the plugin system outright —
    # the `mkdocs.plugins` entry point below would stop being read at all, so
    # every card would vanish from the build. It also moves config to TOML and
    # carries no license yet. An unbounded `>=` would let a resolver make that
    # migration for us, silently, on a routine CI run.
    "mkdocs>=1.6,<2",
    # Material 9 targets MkDocs 1.x and cannot run on 2.0 either. Whatever its
    # next major targets is a decision to take deliberately.
    "mkdocs-material>=9,<10",
    #
    # No mkdocs-d2-plugin. The plugin renders `d2` fences itself, so a missing
    # binary degrades to a labelled placeholder instead of failing the build,
    # and the SVG reaches the page as a data: URI rather than as inline markup
    # (HMD-0022 §5-§6). The `d2` binary itself is not a Python dependency and
    # is installed separately; without it diagrams show their source.
    #
    # No `pygments` ceiling. 0.1.0 carried `pygments<2.20` here because 2.20.0
    # stopped `pymdownx.superfences` matching fences at all. The defect was
    # upstream of Pygments rather than in it, and `pymdown-extensions` 10.21.2
    # fixes it, so the constraint now lives with that package as a floor in the
    # base dependencies above — which is also where it can protect
    # `hmd render --to html`.
]
dev = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://hypermarkdown.org/"
Documentation = "https://hypermarkdown.org/"
Repository = "https://github.com/ewiger/hypermarkdown"
Changelog = "https://github.com/ewiger/hypermarkdown/blob/main/tools/hmd/CHANGELOG.md"
Issues = "https://github.com/ewiger/hypermarkdown/issues"

[project.scripts]
hmd = "hypermarkdown.cli:main"

# Two keys, one class, on purpose. `hypermarkdown` is the supported spelling and
# the one this repository's own `mkdocs.yml` uses. `hyper-markdown` is retained
# as a compatibility alias because this key is the single renamed identifier
# that appears inside files the project does not own — every site built against
# the plugin names it verbatim in its own `mkdocs.yml`, where dropping it is a
# hard build failure reported as an unrecognised plugin, with a cause the site's
# author never saw. When the alias is withdrawn is an open question, not a
# silence; it is not the supported spelling in the meantime.
[project.entry-points."mkdocs.plugins"]
hypermarkdown = "hypermarkdown.mkdocs_plugin:HyperMarkDownPlugin"
hyper-markdown = "hypermarkdown.mkdocs_plugin:HyperMarkDownPlugin"

[tool.setuptools.dynamic]
version = { attr = "hypermarkdown.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
