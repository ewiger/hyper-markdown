site_name: hyper-markdown
site_description: A strict, machine-checkable markdown dialect for project knowledge bases.

# A GitHub project site, so the book is served from a subpath rather than the
# domain root. The build does not need this — MkDocs emits relative links — but
# canonical URLs and `sitemap.xml` are wrong without it.
site_url: https://ewiger.github.io/hyper-markdown/

# The site covers the whole documentation tree, while the `[[…]]` namespace is
# restricted to `doc/wiki` by the plugin's `root` below. The book and the wiki
# build together; only the wiki is a namespace.
docs_dir: doc

# The working memory of the project, not part of the published book.
exclude_docs: |
  *.hmd
  models/
  issues/
  memory/
  proposals/TEMPLATE.md

# A card and its folder note share one URL, so directory URLs are required
# rather than merely preferred (HMD-0002 §1).
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - hyper-markdown:
      root: doc/wiki

# The authored nav wins everywhere except where it asks for the wiki by name.
# `hmd://wiki` is replaced by the section derived from the namespace tree, so
# the book keeps its own order and still says where the cards belong.
nav:
  - Home: index.md
  - The format: public/format.md
  - Namespaces: public/namespaces.md
  - Rich content: public/rich-content.md
  - Publishing: public/publishing.md
  - Wiki:
      - Overview: wiki/README.md
      - hmd://wiki
  - Specifications:
      - proposals/README.md
      - HMD-0001 — MVP: proposals/HMD-0001/README.md
      - HMD-0001 examples: proposals/HMD-0001/examples.md
      - HMD-0002 — MkDocs: proposals/HMD-0002/README.md

extra_css:
  - wiki/assets/hmd.css

# Arithmatex emits `\(…\)` and typesets nothing itself, so math needs MathJax to
# be present or every formula renders as its own source. This is the only
# runtime dependency the site has on a network; the build itself stays offline.
extra_javascript:
  - wiki/assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Cards link out to the repository — proposals, styles, source — with ordinary
# relative markdown links, by the convention in `hyper-markdown.hmd`. Those
# targets are real files but they are not site pages, so a miss is reported
# rather than fatal. Wikilinks are checked by `hmd lint`, not by MkDocs.
validation:
  links:
    not_found: info

# The "free" half of the syntax: everything the format does not own itself
# (HMD-0001 §9).
markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
