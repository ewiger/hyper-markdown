name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Test
        run: uv run python -m pytest

      # Dogfooding gates from HMD-0001 §10: both trees MUST lint clean. The
      # roots are named explicitly so the gates do not depend on marker
      # discovery, and the fixture is deliberately not run under --strict —
      # it carries exactly one expected warning, the red link in glossary/.
      - name: Lint doc/wiki
        run: uv run hmd lint --root doc/wiki --strict

      - name: Lint the example fixture
        run: uv run hmd lint --root examples/small

      - name: Lint the sorting example
        run: uv run hmd lint --root examples/cs-alg-sorting --strict

  # The TypeScript line (HMD-0020, HMD-0021). It runs independently of the
  # Python matrix so neither half can block the other's merge, and it installs
  # Python anyway: the conformance gate below is only meaningful when it can
  # ask the canonical implementation what the right answer is.
  js:
    name: typescript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          npm ci
          uv venv
          uv pip install -e ".[dev]"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Runs the shared corpus and the parity check that shells out to
      # `hmd lint`. A drift between the two implementations fails here.
      - name: Test
        run: npm test

      - name: Package the extension
        run: npm run -w vscode-hyper-markdown package

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-hyper-markdown
          path: packages/vscode-hyper-markdown/*.vsix
          if-no-files-found: error
