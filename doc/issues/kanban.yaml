# Kanban board — the index of doc/issues/.
#
# board.items holds the columns (swimlanes); top to bottom is the flow. Each
# column is an ordered list of issue cards, highest priority first. Move a card
# between columns as work progresses, and bump last_id when adding an issue.
# When an issue is Done and no longer relevant, archive its file to
# .grem/issues/archive/ and delete its card here.
#
# Convention: doc/wiki/kanban.hmd
#
# NUMBERING IS SPLIT BY STREAM. The Python and MkDocs line numbers from 1; the
# TypeScript and editor line numbers from 100. The two develop on separate
# branches and merge in both directions, and a shared counter would collide on
# every merge. Proposals are split the same way at HMD-0020.

board:
  title: "doc/issues/ Kanban board"
  description: "The index of doc/issues/."
  columns: [
    { name: "backlog", description: "Issues that are not yet prioritized." },
    { name: "todo", description: "Issues that are prioritized and ready to work on." },
    { name: "doing", description: "Issues that are currently being worked on." },
    { name: "done", description: "Issues that have been completed." }
  ]
  last_id: 106 # to be incremented when adding a new issue card
  items:
    backlog:
      - id: "0101"
        title: "Live-editing behaviours are only checked by hand"
        file: 0101-live-preview-checks-unautomated.md
      - id: "0102"
        title: "Diagrams render on a white surface in every theme"
        file: 0102-diagram-theme-surface.md
      - id: "0106"
        title: "There is no way to search the wiki from the preview"
        file: 0106-search-the-wiki-from-the-preview.md
    todo:
      - id: "0105"
        title: "The preview freezes on the card it was opened over"
        file: 0105-preview-does-not-follow-the-active-card.md
      - id: "0100"
        title: "A ??? callout snaps shut on every re-render"
        file: 0100-callout-open-state-lost.md
    doing: []
    done:
      - id: "0103"
        title: "The preview is a side-bar view when it wants to be a tab in a column"
        file: 0103-preview-lives-in-an-editor-column.md
      - id: "0104"
        title: "The extension has no logo, and the project already has one"
        file: 0104-the-bolt-is-the-extension-logo.md
