# The repository root, which is deliberately *not* a distribution.
#
# Every tool lives under `tools/`, and the Python one — `tools/hmd` — owns the
# `hypermarkdown` package and its own `pyproject.toml`. This file exists for
# the two things that are genuinely repository-wide: the uv workspace, so a
# single `.venv` and a single `uv.lock` serve the whole checkout, and the
# pytest configuration, because the suite spans a tool's own tests and the
# guards that check this repository's documentation and site.

[tool.uv.workspace]
members = ["tools/hmd"]

[tool.uv.sources]
hypermarkdown = { workspace = true }

# `uv sync` installs this group by default, which is what makes `uv run hmd`,
# `uv run mkdocs`, and `uv run python -m pytest` work from the repository root
# with no arguments. The extras are requested here rather than through
# `uv sync --all-extras`, which has nothing to act on: extras belong to a
# project, and this root is not one.
[dependency-groups]
dev = ["hypermarkdown[mkdocs,dev]"]

# Building the wheel is `uv build --package hypermarkdown`, never a bare
# `uv build`. A bare `uv build` at a workspace root with no `[project]` table
# does not fail — it builds an empty `unknown-0.0.0` distribution and reports
# success. On the release path that is a wrong artifact travelling as far as
# PyPI will take it, so the `--package` flag is load-bearing rather than
# stylistic.

[tool.pytest.ini_options]
# Two roots on purpose. `tools/hmd/tests` belongs to the Python tool and moves
# with it. `tests/` holds the repository's own guards — `test_docs.py` walks
# every tracked `*.md` and `*.hmd` in the checkout, and both files build the
# real site from the root `mkdocs.yml` — so they answer for the repository, not
# for one tool, and filing them under a tool would misplace what they cover.
testpaths = ["tests", "tools/hmd/tests"]
pythonpath = ["tools/hmd/src"]
